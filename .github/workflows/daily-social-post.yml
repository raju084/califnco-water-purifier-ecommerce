name: Daily AI Social Media Automation

on:
  schedule:
    # Runs at 03:30 UTC daily (= 09:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  post-daily-product:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: automation/package.json

      - name: Install Dependencies
        run: |
          cd automation
          npm install

      - name: Execute Daily AI Post to Instagram & WhatsApp
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          WAHA_ENDPOINT: ${{ secrets.WAHA_ENDPOINT }}
        run: |
          cd automation
          npm run post-now
